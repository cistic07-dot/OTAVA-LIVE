<!DOCTYPE html>
<html lang="cs">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VODA-LIVE | Stav vody</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:Arial,Helvetica,sans-serif;

    background:url("images/pozadi_berounka.png") center center/cover fixed;

    color:white;

    min-height:100vh;

}

body::before{

    content:"";

    position:fixed;

    inset:0;

    background:rgba(0,55,90,.45);

    z-index:-1;

}

header{

    text-align:center;

    padding:30px 15px;

}

header img{

    width:230px;

    margin-bottom:10px;

}

header h1{

    font-size:60px;

    text-shadow:2px 2px 8px black;

}

header p{

    font-size:24px;

    color:#dff6ff;

    margin-top:8px;

}

.container{

    width:95%;

    max-width:1100px;

    margin:40px auto;

}

.waterPanel{

    background:#081826;

    border:4px solid #d9d9d9;

    border-radius:22px;

    padding:30px;

    box-shadow:0 10px 30px rgba(0,0,0,.45);

}

.panelTitle{

    text-align:center;

    font-size:36px;

    font-weight:bold;

    margin-bottom:25px;

}

.station{

    text-align:center;

    font-size:34px;

    font-weight:bold;

    margin-bottom:30px;

}

.grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:25px;

}

.box{

    background:#0b2233;

    border:2px solid rgba(255,255,255,.15);

    border-radius:18px;

    padding:25px;

    text-align:center;

}

.label{

    font-size:22px;

    color:#cfefff;

    margin-bottom:12px;

}

.value{

    font-size:70px;

    font-weight:bold;

}

.green{

    color:#5CFF7A;

}

.blue{

    color:#5FD4FF;

}

.state{

    text-align:center;

    margin-top:35px;

}

.badge{

    display:inline-block;

    background:#18b34b;

    color:white;

    font-size:36px;

    font-weight:bold;

    padding:12px 30px;

    border-radius:12px;

}

.update{

    text-align:center;

    margin-top:25px;

    color:#d9eef8;

    font-size:18px;

}

.back{

    display:block;

    width:280px;

    margin:35px auto 0;

    text-align:center;

    text-decoration:none;

    color:white;

    background:#0077cc;

    padding:15px;

    border-radius:14px;

    font-size:22px;

}

.back:hover{

    background:#005fa3;

}

footer{

    text-align:center;

    padding:30px;

    font-size:18px;

}

</style>

</head>

<body>

<header>

<img src="images/logo.png">

<h1>VODA-LIVE</h1>

<p>Aktuální stav vody na Berounce</p>

</header>

<div class="container">

<div class="waterPanel">

<div class="panelTitle">

🌊 BEROUNKA – STAV VODY

</div>

<div class="station">

📍 LIBLÍN

</div>

<div class="grid">

<div class="box">

<div class="label">📏 Výška</div>

<div class="value green" id="height">98 cm</div>

</div>

<div class="box">

<div class="label">💧 Průtok</div>

<div class="value blue" id="flow">18,4 m³/s</div>

</div>

</div>
<div class="state">

<span class="badge" id="state">

🟢 IDEÁLNÍ PRO KANOE

</span>

</div>

<div class="update">

🕒 Poslední aktualizace

<br><br>

<span id="updateTime"></span>

</div>

<a href="index.html" class="back">

⬅ Zpět na hlavní stránku

</a>

</div>

</div>

<script>

// ===== TESTOVACÍ DATA =====

const voda = {

    stanice: "Liblín",

    vyska: "98 cm",

    prutok: "18,4 m³/s",

    stav: "🟢 IDEÁLNÍ PRO KANOE"

};

// ===== ZOBRAZENÍ DAT =====

document.getElementById("height").textContent = voda.vyska;
document.getElementById("flow").textContent = voda.prutok;
document.getElementById("state").textContent = voda.stav;

// ===== AKTUÁLNÍ DATUM A ČAS =====

function updateTime(){

    const now = new Date();

    document.getElementById("updateTime").textContent =
        now.toLocaleDateString("cs-CZ") +
        " • " +
        now.toLocaleTimeString("cs-CZ",{
            hour:"2-digit",
            minute:"2-digit"
        });

}

updateTime();

setInterval(updateTime,60000);

// ======================================
// ZDE POZDĚJI PŘIPOJÍME DATA Z ČHMÚ
// ======================================

</script>

<footer>

🌊 VODA-LIVE • Berounka • Liblín

</footer>

</body>

</html>
